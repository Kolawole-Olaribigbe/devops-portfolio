
stages:
  - validate
  - build
  - deploy

validate-compose:
  stage: validate
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    POSTGRES_DB: ci_todos
    POSTGRES_USER: ci_user
    POSTGRES_PASSWORD: ci_password
    MYSQL_ROOT_PASSWORD: ci_root_password
    MYSQL_DATABASE: ci_todos
    MYSQL_USER: ci_user
    MYSQL_PASSWORD: ci_password
  script:
    - cd consolidated-ec2
    - docker compose config

validate-nginx:
  stage: validate
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker network create ci-todo-network
    - docker run -d --name ci-rust-todo-api --network ci-todo-network --network-alias rust-todo-api nginx:alpine
    - docker run -d --name ci-todo-nginx --network ci-todo-network --network-alias todo-nginx nginx:alpine
    - docker run -d --name ci-sqlite-todo-api --network ci-todo-network --network-alias sqlite-todo-api nginx:alpine
    - docker run --rm --network ci-todo-network -v "$CI_PROJECT_DIR/consolidated-ec2/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" --entrypoint nginx nginx:alpine -t
    - docker rm -f ci-rust-todo-api ci-todo-nginx ci-sqlite-todo-api
    - docker network rm ci-todo-network

build-images:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    POSTGRES_DB: ci_todos
    POSTGRES_USER: ci_user
    POSTGRES_PASSWORD: ci_password
    MYSQL_ROOT_PASSWORD: ci_root_password
    MYSQL_DATABASE: ci_todos
    MYSQL_USER: ci_user
    MYSQL_PASSWORD: ci_password
  script:
    - cd consolidated-ec2
    - docker compose build

deploy-ec2:
  stage: deploy
  image: alpine:3.21
  needs:
    - build-images
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/deploy_key \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        "$EC2_USER@$EC2_HOST" '
          set -eu
          cd /home/ubuntu/devops-portfolio
          git fetch origin main
          git merge --ff-only origin/main
          cd consolidated-ec2
          docker compose config -q
          docker compose up -d --build
          docker compose ps
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
