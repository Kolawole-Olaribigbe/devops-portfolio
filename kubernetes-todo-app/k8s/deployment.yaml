apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-todo
  namespace: kubernetes-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-todo
  template:
    metadata:
      labels:
        app: kubernetes-todo
    spec:
      containers:
        - name: kubernetes-todo
          image: kolaolaribigbe/kubernetes-todo-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: kubernetes-todo-config
            - secretRef:
                name: kubernetes-todo-secret
          volumeMounts:
            - name: todo-storage
              mountPath: /data
      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: kubernetes-todo-pvc
