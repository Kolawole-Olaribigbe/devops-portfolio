apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-todo-ingress
  namespace: kubernetes-todo
spec:
  ingressClassName: nginx
  rules:
    - host: todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-todo-service
                port:
                  number: 80
