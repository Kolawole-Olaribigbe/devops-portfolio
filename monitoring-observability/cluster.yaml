
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: monitoring-cluster
  region: us-east-1
  version: "1.37"

vpc:
  subnets:
    public:
      us-east-1a:
        id: subnet-REPLACE_WITH_PUBLIC_SUBNET_A
      us-east-1b:
        id: subnet-REPLACE_WITH_PUBLIC_SUBNET_B

  clusterEndpoints:
    publicAccess: true
    privateAccess: false

  publicAccessCIDRs:
    - YOUR_PUBLIC_IP/32

managedNodeGroups:
  - name: monitoring-workers
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 30
    privateNetworking: false
    disablePodIMDS: true
    ssh:
      allow: false

