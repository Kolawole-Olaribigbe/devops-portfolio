
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: monitoring-cluster
  region: us-east-1
  version: "1.37"

vpc:
  subnets:
    public:
      us-east-1a:
        id: subnet-0620c43a1d668fb48
      us-east-1b:
        id: subnet-038eb74b40b73064e

  clusterEndpoints:
    publicAccess: true
    privateAccess: false

  publicAccessCIDRs:
    - 102.67.1.61/32

managedNodeGroups:
  - name: monitoring-workers
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 30
    privateNetworking: false
    disablePodIMDS: true
    ssh:
      allow: false

