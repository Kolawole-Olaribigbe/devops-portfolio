services:

  nginx:
    image: nginx:alpine
    container_name: todo-main-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rust-todo-api
      - todo-nginx
      - sqlite-todo-api
    restart: unless-stopped
    networks:
      - todo-network

  rust-todo-api:
    build:
      context: ../rust-postgres-todo-api
    container_name: rust-todo-api
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@rust-todo-postgres:5432/${POSTGRES_DB}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      rust-todo-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

  rust-todo-postgres:
    image: postgres:16-alpine
    container_name: rust-todo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - todo-network

  todo-nginx:
    image: nginx:alpine
    container_name: todo-nginx
    volumes:
      - ../php-mysql-todo-api:/var/www/html:ro
      - ../php-mysql-todo-api/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - todo-php
    restart: unless-stopped
    networks:
      - todo-network

  todo-php:
    build:
      context: ../php-mysql-todo-api
    container_name: todo-php
    environment:
      DB_HOST: todo-mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      todo-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

  todo-mysql:
    image: mysql:8.0
    container_name: todo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - todo-network

  sqlite-todo-api:
    build:
      context: ../todo-api
    container_name: sqlite-todo-api
    volumes:
      - sqlite-data:/data
    environment:
      DB_PATH: /data/todos.db
    restart: unless-stopped
    networks:
      - todo-network

volumes:
  postgres-data:
  mysql-data:
  sqlite-data:

networks:
  todo-network:
    driver: bridge
