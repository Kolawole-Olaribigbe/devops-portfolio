server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        default_type text/plain;
        return 200 "Todo API Gateway is running\n";
    }

    location /rust-todos/ {
	set $rust_api rust-todo-api:3000;
	rewrite ^/rust-todos/(.*)$ /$1 break;
	proxy_pass http://$rust_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /php-todos/ {
        set $php_nginx todo-nginx;
        proxy_pass http://$php_nginx/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sqlite-todos/ {
	set $sqlite_api sqlite-todo-api:3000;
	rewrite ^/sqlite-todos/(.*)$ /$1 break;
	proxy_pass http://$sqlite_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
